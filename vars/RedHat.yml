---
# =============================================================================
# Variables spécifiques RedHat/CentOS/Rocky/Alma
# =============================================================================

# Chemin des librairies 64-bit
lib64_path: /usr/lib64

# Chemin des librairies NSS (pour résolution passwd/group/hosts)
nss_lib_path: /usr/lib64

# Librairies NSS à copier dans les jails
nss_libs:
  - libnss_files.so.2
  - libnss_dns.so.2
  - libnss_compat.so.2

# Chemin terminfo pour le support terminal
terminfo_paths:
  - /usr/share/terminfo
